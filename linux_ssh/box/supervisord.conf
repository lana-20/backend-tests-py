; supervisord keeps these running and restarts them if they die.

[program:sshd]
command=/usr/sbin/sshd -D -e
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0

[program:cron]
command=/usr/sbin/cron -f
autorestart=true

[program:demo]
command=/usr/bin/python3 /opt/demo/demo_service.py --config /etc/demo/demo.conf
; Least privilege: the service runs as its own unprivileged user, not root.
user=app
autorestart=true
; Counted as "started" after 1 s up; a crash loop faster than that is given up on.
startsecs=1
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
