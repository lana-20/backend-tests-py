name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: 0.12.6
  NODE_VERSION: 22

jobs:
  static:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with: { version: '${{ env.UV_VERSION }}', enable-cache: true }
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy .

  sql:
    name: SQL (${{ matrix.engine }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [postgres, mysql, mssql, sqlite]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with: { version: '${{ env.UV_VERSION }}', enable-cache: true }
      - run: uv sync --locked
      # Pull outside the test run, so the pull time doesn't count against the
      # connection timeout inside the tests.
      - name: Pull the database image
        if: matrix.engine != 'sqlite'
        run: |
          image=$(uv run python -c "from sql_engines.tests import servers; print(servers.IMAGES['${{ matrix.engine }}'])")
          docker pull "$image"
      - run: uv run pytest sql_engines -m ${{ matrix.engine }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: allure-results-sql-${{ matrix.engine }}
          path: allure-results
          retention-days: 7

  report:
    name: Build the report site
    needs: [sql]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '${{ env.NODE_VERSION }}' }
      - uses: actions/download-artifact@v8
        with:
          pattern: allure-results-*
          path: allure-results
          merge-multiple: true
      - name: Generate the Allure report
        run: npx --yes allure@3.33.0 generate allure-results --output _site/allure
      - name: Add the landing page
        run: cp site/index.html _site/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Publish to GitHub Pages
    needs: report
    if: always() && needs.report.result == 'success' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
